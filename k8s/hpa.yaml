# Scale between 2 and 5 replicas on CPU (needs the metrics-server addon).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heartrisk-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heartrisk-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
