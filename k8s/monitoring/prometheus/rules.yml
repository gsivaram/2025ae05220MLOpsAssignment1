groups:
  - name: heartrisk-api
    rules:
      - record: heartrisk:request_rate:1m
        expr: sum by (path, status) (rate(heartrisk_http_requests_total[1m]))
      - alert: HeartRiskApiDown
        expr: (sum(up{job="heartrisk-api"}) or vector(0)) < 1   # "or vector(0)": no targets at all must still fire
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "No heartrisk-api replica is being scraped successfully"
      - alert: HeartRiskApiHighErrorRate
        expr: |
          sum(rate(heartrisk_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(heartrisk_http_requests_total[5m])), 1e-9) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of API requests return 5xx"
      - alert: HeartRiskApiSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(heartrisk_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 API latency above 500 ms"
