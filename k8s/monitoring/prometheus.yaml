apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app.kubernetes.io/name: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            # Served under /prometheus so it can share the Ingress with the API.
            - --web.external-url=/prometheus/
            - --web.route-prefix=/prometheus
          ports:
            - { name: http, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /prometheus/-/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /prometheus/-/healthy, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }   # generated by kustomization.yaml (hash suffix => auto-restart on change)
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app.kubernetes.io/name: prometheus }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: http }
