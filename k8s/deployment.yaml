apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartrisk-api
  labels:
    app.kubernetes.io/name: heartrisk-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: heartrisk-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never drop below the desired replica count during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heartrisk-api
      annotations:
        # Picked up by Prometheus' pod discovery in the monitoring stack.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          # scripts/k8s_deploy.sh builds the image locally, loads it into minikube and
          # substitutes the exact tag at apply time; nothing is pulled from a registry.
          image: heartrisk-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: heartrisk-api-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:          # model load: allow up to 60 s before liveness kicks in
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:        # only receive traffic once the model is loaded
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
