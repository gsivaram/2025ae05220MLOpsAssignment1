# Exposes the API outside the cluster through the NGINX ingress controller (minikube addon).
#   by host name:  curl -H "Host: heartrisk.local" http://<minikube ip>/health
#   by IP:         http://<minikube ip>/docs   (second rule - lets a browser reach it without /etc/hosts)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heartrisk-api
  labels:
    app.kubernetes.io/name: heartrisk-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: heartrisk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heartrisk-api
                port:
                  name: http
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heartrisk-api
                port:
                  name: http
