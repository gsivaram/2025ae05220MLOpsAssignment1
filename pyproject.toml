[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartrisk"
version = "0.1.0"
description = "Heart disease risk classifier with an end-to-end MLOps pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
# Third-party deprecation noise (mlflow / pydantic / setuptools); our own warnings still show.
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore:.*utcnow.*:DeprecationWarning",
    "ignore::UserWarning:mlflow.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
